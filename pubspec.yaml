name: finny
description: Питомец Финни — игровой сервис финансовой грамотности для детей 7–11 лет.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  flutter_svg: ^2.2.0
  audioplayers: ^6.8.1
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/images/shop/
    - assets/images/pets/
    - assets/images/pets/thumbs/
    - assets/sounds/
    - assets/4.mp3
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
